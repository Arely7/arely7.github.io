<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="./css/styles.css">
    <title>Colecciones</title>
</head>
<body>
    <header>
        <div class="titulo">
            <h2 class="cherry rosa">Cherry</h2>
            <h4 class="boutique">BOUTIQUE</h4>
        </div>
        <div class="menu">
            <nav>
                <ul class="menu2">
                    <li class="m1">Inicio</li>
                    <li class="rosa m1">Colecciones</li>
                    <li class="m1">Comprar</li>
                    <li class="m1">Nosotros</li>
                </ul>
            </nav>
        </div>
        <div>
            <i class="fa fa-magnifying-glass ic"></i>
            <i class="fa fa-heart ic"></i>
            <i class="fa fa-bag-shopping ic"></i>
        </div>
    </header>
    <section id="colecciones">
        <div class="centrar">
            <div>
                <h1 class="cl">Colecciones</h1>
                <p class="encuentra">Encuentra todo lo que amas, en un solo lugar.</p>
                <button class="buscar">
                    <p>Buscar productos...</p>
                    <i class="fa fa-magnifying-glass"></i>
                </button>
            </div>
        </div>
    </section>
    <section id="categorias">
        <div class="circulo cu"><i class="fa fa-shopping-bag rosa"></i>/div>
    </section>
    <section id="catalogo">
        <div class="lado">
            <div class="filtros">
                <h3>Filtros</h3>
                <h4>Categoría</h4>
                <label><input type="checkbox">Ropa</label>
                <label><input type="checkbox">Zapatos</label>
                <label><input type="checkbox">Bolsas</label>
                <label><input type="checkbox">Accesorios</label>
                <h4>Subcategoría</h4>
                <label><input type="checkbox">Tops</label>
                <label><input type="checkbox">Vestidos</label>
                <label><input type="checkbox">Pantalones</label>
                <label><input type="checkbox">Faldas</label>
                <label><input type="checkbox">Sueteres</label>
                <label><input type="checkbox">Chamarras</label>
                <label><input type="checkbox">Conjuntos</label>
                <h4>Talla</h4>
                <label><input type="checkbox">XS</label>
                <label><input type="checkbox">S</label>
                <label><input type="checkbox">M</label>
                <label><input type="checkbox">L</label>
                <label><input type="checkbox">XL</label>
                <h4>Color</h4>
                <div class="colores">
                    <span class="col rosa-bg"></span>
                    <span class="col rosa2-bg"></span>
                    <span class="col linea-bg"></span>
                    <span class="col blanco-bg"></span>
                </div>
                <div class="colores">
                    <span class="col negro"></span>
                    <span class="col guinda-bg"></span>
                    <span class="col cafe-bg"></span>
                    <span class="col rosa3-bg"></span>
                    <span class="mas">Más...</span>
                </div>
                <h4>Precio</h4>
                <label><input type="checkbox">$0.00-$499.00</label>
                <label><input type="checkbox">$500.00-$999.00</label>
                <label><input type="checkbox">$1000.00-$1499.00</label>
                <label><input type="checkbox">$1500.00+</label>
            </div>
            <img class="globos" src="img/Rectangle 24.png">
        </div>
        <div class="productos">
            <div class="barra">
                <div>
                    <label>Ordenar por:</label>
                    <select>
                        <option>Más nuevos</option>
                        <option>Precio: menor a mayor</option>
                        <option>Precio: mayor a menor</option>
                    </select>
                </div>
                <p class="rosa">Mostrando 1-12 de 48 productos</p>
            </div>
            <div class="lista">
                <div class="prod">
                    <div class="foto">
                        <i class="fa fa-heart-o corazon"></i>
                        <img src="img/Blusa rosa.png">
                    </div>
                    <p class="nom">Top con moño</p>
                    <p class="nom">$399.00 MXN</p>
                    <div class="colores">
                        <span class="col blanco-bg"></span>
                        <span class="col rosa-bg"></span>
                        <span class="guinda-bg"></span>
                    </div>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
