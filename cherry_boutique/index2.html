<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="./css/styles.css">
    <title>Colecciones</title>
</head>
<body>
    <header>
        <div class="titulo">
            <h2 class="cherry rosa">Cherry</h2>
            <h4 class="boutique">BOUTIQUE</h4>
        </div>
        <div class="menu">
            <nav>
                <ul class="menu2">
                    <li class="m1">Inicio</li>
                    <li class="rosa m1">Colecciones</li>
                    <li class="m1">Comprar</li>
                    <li class="m1">Nosotros</li>
                </ul>
            </nav>
        </div>
        <div>
            <i class="fa fa-magnifying-glass ic"></i>
            <i class="fa fa-heart ic"></i>
            <i class="fa fa-bag-shopping ic"></i>
        </div>
    </header>
    <section id="colecciones">
        <div class="centrar">
            <div>
                <h1 class="cl">Colecciones</h1>
                <p class="encuentra">Encuentra todo lo que amas, en un solo lugar.</p>
                <button class="buscar">
                    <p>Buscar productos...</p>
                    <i class="fa fa-magnifying-glass"></i>
                </button>
            </div>
        </div>
    </section>
    <section id="categorias">
        <div class="circulo cu"><i class="fa fa-shopping-bag rosa"></i>/div>
        <div class="circulo cu"><i class="fa fa-briefcase rosa"></i>/div>
        <div class="curculo cu"><i class="fa fa-diamond rosa"></i>/div>
    </section>
</body>
</html>
